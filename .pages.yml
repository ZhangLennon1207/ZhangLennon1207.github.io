media:
  - name: post_images
    label: 文章图片
    input: public/images/posts
    output: /images/posts
    rename: safe
    extensions: [png, jpg, jpeg, webp, avif, gif]
  - name: audio
    label: 音频
    input: public/audio
    output: /audio
    rename: safe
    extensions: [mp3, m4a, ogg, wav]

content:
  - name: now
    label: 生活的 B 面 · 听读记录
    type: file
    path: src/data/now.json
    format: json
    fields:
      - { name: musicTitle, label: 最近在听的歌或专辑, type: string }
      - { name: musicArtist, label: 音乐人, type: string }
      - { name: musicUrl, label: 音乐平台链接, type: string, description: Apple Music 歌曲或专辑链接会自动提供站内试听；其他平台显示直达链接。 }
      - name: audioUrl
        label: 可播放音频（选填）
        type: file
        description: 上传你有权分享的音频。留空时使用音乐平台链接，访客自行选择是否播放。
        options: { media: audio }
      - { name: bookTitle, label: 最近在读的书, type: string }
      - { name: bookNote, label: 读书随记, type: text }
      - { name: bookUrl, label: 书籍链接（选填）, type: string }
      - { name: filmTitle, label: 最近在看的电影, type: string }
      - { name: filmNote, label: 观影随记, type: text }
      - { name: filmUrl, label: 电影链接（选填）, type: string }
      - name: goatcounterCode
        label: GoatCounter 站点代码（选填）
        type: string
        description: 注册后填写 xxx.goatcounter.com 中的 xxx 即可启用统计，留空时关闭。
        pattern:
          regex: '^[a-z0-9-]*$'
          message: 只填写小写字母、数字和短横线组成的站点代码。
  - name: posts
    label: 文章
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{title}.md"
      field: create
    view:
      fields: [title, published, category, draft]
      primary: title
      sort: published
      order: desc
    fields:
      - { name: title, label: 标题, type: string, required: true }
      - { name: description, label: 摘要, type: text, description: 显示在首页文章卡片和搜索结果中。 }
      - name: published
        label: 发布日期
        type: date
        required: true
        options: { format: yyyy-MM-dd }
      - name: category
        label: 栏目
        type: select
        required: true
        options: { values: [随笔, 乐评, 旅行, 哲学, 技术, 电影] }
      - { name: tags, label: 标签, type: string, list: true }
      - name: image
        label: 封面图
        type: image
        options: { media: post_images, path: public/images/posts, rename: safe }
      - { name: author, label: 作者, type: string, default: Zhang Lennon }
      - name: lang
        label: 正文语言
        type: select
        default: zh-CN
        options:
          values:
            - { name: zh-CN, label: 中文 }
            - { name: en, label: English }
      - { name: pinned, label: 首页置顶, type: boolean, default: false }
      - { name: draft, label: 草稿（开启时不会公开）, type: boolean, default: true }
      - { name: authorUrl, label: 原作者链接（选填）, type: string }
      - { name: sourceUrl, label: 原文链接（选填）, type: string, description: 填写后文章末尾会自动显示来源。 }
      - { name: licenseUrl, label: 授权协议链接（选填）, type: string }
      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
          media: post_images
          path: public/images/posts
          rename: safe

  - name: about
    label: 关于我
    type: file
    path: src/content/spec/about.md
    format: yaml-frontmatter
    fields:
      - name: body
        label: 页面内容
        type: rich-text
        required: true
        options: { format: markdown, switcher: true, media: post_images, rename: safe }
